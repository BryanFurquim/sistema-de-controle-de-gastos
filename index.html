<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de gastos</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <h1>Sistema controle de gastos</h1>
    </header>
    <main>
        <div id="fundoPai">
            <section id="ContainerPai">
                <div class="dadosCartao">
                    <h2>Dados do cartão:</h2><hr>
                            <p><strong>Responsável:</strong> Eduardo Amaral</p>
                            <p><strong>Departamento:</strong> Administrativo</p>
                            <p><strong>Limite mensal: R$</strong> 10.000,00</p>
                            <p><strong>Total utilizado: R$</strong> 0,00</p>
                            <p><strong>Limite disponível: R$</strong> 10.000,00</p>
                </div>
                <div class="formulario">
                    <form action="cadastro.php">
                        <h2>Cadastro de gastos:</h2> <hr>
                        <label for="idescription" class="ajustarPosition" >Descrição:</label>
                        <input type="text" name="desc" id="idescription" placeholder="EX: Compra do mês"> <br>

                        <label for="icategory" class="ajustarPosition">Categoria:</label>
                        <select name="category" id="icategory">
                            <option value="escolhaopcao">Escolha uma opção</option>
                            <option value="alimentacao">Alimentação</option>
                            <option value="combustivel">Combustível</option>
                            <option value="material">Material</option>
                            <option value="transporte">Transporte</option>
                            <option value="outros">Outros</option> 
                        </select> <br>

                        <label for="inumber">Valor:</label> 
                        <input type="number" name="number" id="inumber" placeholder="EX: 200,00"> <br>

                        <label for="idate">Data: </label>
                        <input type="date" name="date" id="idate"> <br>

                        <input id="butcadastro" type="submit" value="Cadastrar">
                    </form>

                </div>

            </section>
        </div>
    </main>

    <script src="script/script.js"></script>
</body>
</html>
