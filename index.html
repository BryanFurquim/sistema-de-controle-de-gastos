<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Gastos </title>
<link rel="stylesheet" href="style/style.css">
</head>

<body>

    <header>
      <h1>Sistema de Controle de Gastos</h1>
    </header>
    <div class="page">
        <div class="dadosCartao">
            <h2>Dados do Cartão : </h2>
            <div class="dadosGrid">
            <div class="cardInfos">
                <label>RESPONSÁVEL</label>
                <div class="bold">Eduardo Amaral</div>
            </div>
            <div class="cardInfos">
                <label>DEPARTAMENTO</label>
                <div class="bold">Compras</div>
            </div>
            <div class="cardInfos">
                <label>LIMITE MENSAL</label>
                <div class="bold">R$ 5.000,00</div>
            </div>
            <div class="cardInfos">
                <label>TOTAL GASTO</label>
                <div class="Vgasto">R$ 100,00</div>
            </div>
            <div class="cardInfos">
                <label>SALDO DISPONÍVEL</label>
                <div class="Vdisponivel">R$ 4.900,00</div>
            </div>
            </div>
  </div>

  <div class="cadastro">
    <h2>Cadastrar Gasto :</h2>
    <form >
      <div class="cadastroDoGasto">
        <label for="idescricao">Descrição</label>
        <input type="text" id="idescricao" placeholder="Ex : Compra do mês">
      </div>
      <div class="cadastroDoGasto">
        <label for="icategoria">Categoria</label>
        <select id="icategoria">
          <option value="escolher">Escolha uma opção</option>
          <option value="alimentacao">Alimentação</option>
          <option value="combustivel">Combustível</option>
          <option value="material">Material</option>
          <option value="transporte">Transporte</option>         
          <option value="outros">Outros</option>
        </select>
      </div>
      <div class="cadastroDoGasto">
        <label for="ivalor">Valor (R$)</label>
        <input type="number" id="ivalor" placeholder="0,00" step="0.01">
      </div>
      <div class="cadastroDoGasto">
        <label for="idata">Data</label>
        <input type="date" id="idata">
      </div>
      <button type="submit" class="butCadastro">Cadastrar gasto</button>
    </form>
  </div>

    <div class="lancamentos">
    <h2>Lançamentos</h2>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Categoria</th>
          <th>Valor</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabela-lancamentos">
        <tr>
          <td data-label="Data :"></td>
          <td data-label="Descrição : "> </td>
          <td data-label="Categoria : "> </td>
          <td data-label="Valor : "> </td>
          <td data-label="Ação : "> </td>
        </tr>
        <tr>
            <td data-label="Data :"> </td>
            <td data-label="Descrição : "> </td>
            <td data-label="Categoria : "> </td>
            <td data-label="Valor : "> </td>
            <td data-label="Ação : "> </td>
        </tr>
         <tr>
            <td data-label="Data :"> </td>
            <td data-label="Descrição : "> </td>
            <td data-label="Categoria : "> </td>
            <td data-label="Valor : "> </td>
            <td data-label="Ação : "> </td>
        </tr>
         <tr>
            <td data-label="Data :"> </td>
            <td data-label="Descrição : "> </td>
            <td data-label="Categoria : "> </td>
            <td data-label="Valor : "> </td>
            <td data-label="Ação : "> </td>
        </tr>
         <tr>
            <td data-label="Data :"> </td>
            <td data-label="Descrição : "> </td>
            <td data-label="Categoria : "> </td>
            <td data-label="Valor : "> </td>
            <td data-label="Ação : "> </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>



</body>
</html>
